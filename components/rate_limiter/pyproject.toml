[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsegrid-rate-limiter"
version = "0.1.0"
description = "Atomic distributed admission with bounded conservative fallback"
requires-python = ">=3.11"
dependencies = ["redis==5.2.1"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]
test = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "fastapi==0.115.12", "httpx==0.28.1"]

[tool.setuptools.package-data]
pulsegrid_rate_limiter = ["*.lua"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
