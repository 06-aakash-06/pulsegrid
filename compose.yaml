name: pulsegrid
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: pulsegrid_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
      PATIENT_DB_PASSWORD: ${PATIENT_DB_PASSWORD:?Generate .env first}
      PATIENT_MIGRATION_PASSWORD: ${PATIENT_MIGRATION_PASSWORD:?Generate .env first}
      DOCTOR_DB_PASSWORD: ${DOCTOR_DB_PASSWORD:?Generate .env first}
      DOCTOR_MIGRATION_PASSWORD: ${DOCTOR_MIGRATION_PASSWORD:?Generate .env first}
      APPOINTMENT_DB_PASSWORD: ${APPOINTMENT_DB_PASSWORD:?Generate .env first}
      APPOINTMENT_MIGRATION_PASSWORD: ${APPOINTMENT_MIGRATION_PASSWORD:?Generate .env first}
      RECORDS_DB_PASSWORD: ${RECORDS_DB_PASSWORD:?Generate .env first}
      RECORDS_MIGRATION_PASSWORD: ${RECORDS_MIGRATION_PASSWORD:?Generate .env first}
      PHARMACY_DB_PASSWORD: ${PHARMACY_DB_PASSWORD:?Generate .env first}
      PHARMACY_MIGRATION_PASSWORD: ${PHARMACY_MIGRATION_PASSWORD:?Generate .env first}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?Generate .env first}
      BILLING_MIGRATION_PASSWORD: ${BILLING_MIGRATION_PASSWORD:?Generate .env first}
      EMERGENCY_DB_PASSWORD: ${EMERGENCY_DB_PASSWORD:?Generate .env first}
      EMERGENCY_MIGRATION_PASSWORD: ${EMERGENCY_MIGRATION_PASSWORD:?Generate .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [database]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate .env first}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory 64mb --maxmemory-policy noeviction']
    volumes: [redis_data:/data]
    networks: [backbone]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-alpine@sha256:2cb43283d8bbd3caa6c0f0dc00e96c8de772df33df7fd8af6aee4d605aeb8ada
    environment:
      RABBITMQ_DEFAULT_USER: pulsegrid_infra
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Generate .env first}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    networks: [backbone]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  traefik:
    image: traefik:v3@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
    ports: ['127.0.0.1:${GATEWAY_PORT:-8080}:8080']
    volumes:
      - ./infra/traefik:/etc/traefik:ro
    networks:
      edge:
        ipv4_address: ${GATEWAY_IP:-172.29.40.2}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 5s
      timeout: 3s
      retries: 20
  patient:
    image: pulsegrid-patient:local
    build: ./services/patient
    environment:
      PULSEGRID_PATIENT_DB_HOST: "postgres"
      PULSEGRID_PATIENT_DB_NAME: "patient_db"
      PULSEGRID_PATIENT_DB_USER: "patient_app"
      PULSEGRID_PATIENT_DB_PASSWORD: "${PATIENT_DB_PASSWORD:?Generate .env first}"
      FORWARDED_ALLOW_IPS: "${GATEWAY_IP:-172.29.40.2}"
      PULSEGRID_PATIENT_DB_POOL_SIZE: "${DB_POOL_SIZE:-3}"
      PULSEGRID_PATIENT_DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-2}"
      PULSEGRID_PATIENT_DB_POOL_TIMEOUT: "${DB_POOL_TIMEOUT:-2}"
      PULSEGRID_PATIENT_DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-2}"
      PULSEGRID_PATIENT_DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-2000}"
      PULSEGRID_PATIENT_DB_HEALTH_TIMEOUT: "${DB_HEALTH_TIMEOUT:-3}"
    depends_on:
      postgres:
        condition: service_healthy
      patient-migrate:
        condition: service_completed_successfully
    networks: [edge, database]
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
  patient-migrate:
    image: pulsegrid-patient:local
    build: ./services/patient
    command: [alembic, upgrade, head]
    environment:
      PULSEGRID_PATIENT_DB_HOST: postgres
      PULSEGRID_PATIENT_DB_NAME: patient_db
      PULSEGRID_PATIENT_DB_USER: patient_migration
      PULSEGRID_PATIENT_DB_PASSWORD: ${PATIENT_MIGRATION_PASSWORD:?Generate .env first}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
    restart: 'no'
    mem_limit: 192m
    cpus: 0.5
