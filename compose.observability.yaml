services:
  patient:
    environment:
      PULSEGRID_TELEMETRY_ENABLED: "true"
      PULSEGRID_TRACE_SAMPLE_RATIO: "1.0"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: "2000"
    networks: [observability]
  doctor:
    environment:
      PULSEGRID_TELEMETRY_ENABLED: "true"
      PULSEGRID_TRACE_SAMPLE_RATIO: "1.0"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: "2000"
    networks: [observability]
  doctor_replica:
    environment:
      PULSEGRID_TELEMETRY_ENABLED: "true"
      PULSEGRID_TRACE_SAMPLE_RATIO: "1.0"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: "2000"
    networks: [observability]
  appointment:
    environment:
      PULSEGRID_TELEMETRY_ENABLED: "true"
      PULSEGRID_TRACE_SAMPLE_RATIO: "1.0"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: "2000"
      PULSEGRID_CONTROL_ROOM_PROMETHEUS_URL: http://prometheus:9090
      PULSEGRID_CONTROL_ROOM_TEMPO_URL: http://tempo:3200
    networks: [observability]
  records:
    environment:
      PULSEGRID_TELEMETRY_ENABLED: "true"
      PULSEGRID_TRACE_SAMPLE_RATIO: "1.0"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: "2000"
    networks: [observability]
  pharmacy:
    environment:
      PULSEGRID_TELEMETRY_ENABLED: "true"
      PULSEGRID_TRACE_SAMPLE_RATIO: "1.0"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: "2000"
    networks: [observability]
  billing:
    environment:
      PULSEGRID_TELEMETRY_ENABLED: "true"
      PULSEGRID_TRACE_SAMPLE_RATIO: "1.0"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: "2000"
    networks: [observability]
  emergency:
    environment:
      PULSEGRID_TELEMETRY_ENABLED: "true"
      PULSEGRID_TRACE_SAMPLE_RATIO: "1.0"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: "2000"
    networks: [observability]
  rabbitmq:
    volumes:
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks: [observability]
  traefik:
    networks:
      edge:
        ipv4_address: ${GATEWAY_IP:-172.29.40.2}
      observability: {}

  prometheus:
    image: prom/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [observability]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25

  blackbox:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./infra/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [observability]
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.1

  tempo:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    command: [-config.file=/etc/tempo/tempo.yml]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks: [observability]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command: [--config=/etc/otel/collector.yml]
    volumes:
      - ./infra/otel/collector.yml:/etc/otel/collector.yml:ro
    networks: [observability]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.1

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Add a generated password to .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_LOG_MODE: console
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [observability, grafana_access]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25

networks:
  observability:
    internal: true
  grafana_access:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  prometheus_data:
  tempo_data:
  grafana_data:
