extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 20
  attributes/sanitize:
    actions:
      - key: url.full
        action: delete
      - key: url.path
        action: delete
      - key: url.query
        action: delete
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - key: db.statement
        action: delete
      - key: db.query.text
        action: delete
      - key: client.address
        action: delete
      - key: network.peer.address
        action: delete
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 256
    retry_on_failure:
      enabled: true
      max_interval: 2s
      max_elapsed_time: 10s

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sanitize, batch]
      exporters: [otlp_grpc/tempo]
