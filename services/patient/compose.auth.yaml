# Combine with root compose.yaml. Generate ignored keys first; only Patient gets user-signing secrets.
services:
  patient:
    image: pulsegrid-auth-patient:local
    user: "0:0"
    entrypoint: [python, -m, patient_service.secure_entrypoint]
    command: [uvicorn, patient_service.main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, --no-access-log]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/run/credentials:mode=0700']
    environment:
      PULSEGRID_PATIENT_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      PULSEGRID_PATIENT_AUTH_JWKS_PATH: /run/auth/user-jwks.json
      PULSEGRID_PATIENT_AUTH_SERVICE_JWKS_PATH: /run/auth/service-jwks.json
      PULSEGRID_PATIENT_AUTH_SERVICE_PRIVATE_KEY_PATH: /run/auth/service.pem
      PULSEGRID_PATIENT_AUTH_SERVICE_KID: patient-service-1
      PULSEGRID_PATIENT_AUTH_PRIVATE_KEY_PATH: /run/auth/patient-signing.pem
      PULSEGRID_PATIENT_AUTH_IDEMPOTENCY_SECRET_PATH: /run/auth/idempotency.key
      PULSEGRID_PATIENT_AUTH_ACCESS_SECONDS: ${AUTH_ACCESS_SECONDS:-600}
      PULSEGRID_PATIENT_AUTH_REFRESH_IDLE_SECONDS: ${AUTH_REFRESH_IDLE_SECONDS:-604800}
      PULSEGRID_PATIENT_AUTH_REFRESH_ABSOLUTE_SECONDS: ${AUTH_REFRESH_ABSOLUTE_SECONDS:-2592000}
      PULSEGRID_PATIENT_AUTH_ARGON_MEMORY_KIB: ${AUTH_ARGON_MEMORY_KIB:-65536}
      PULSEGRID_PATIENT_AUTH_ARGON_TIME_COST: ${AUTH_ARGON_TIME_COST:-3}
      PULSEGRID_PATIENT_AUTH_KID: ${AUTH_KID:-patient-dev-1}
      PULSEGRID_PATIENT_AUTH_ORIGINS: ${AUTH_ORIGINS:?Set explicit browser origins}
      PULSEGRID_PATIENT_AUTH_ALLOW_HTTP: ${AUTH_ALLOW_HTTP:-false}
    volumes:
      - ${AUTH_KEYS_DIRECTORY:?Generate keys first}/user-jwks.json:/run/auth/user-jwks.json:ro
      - ${AUTH_KEYS_DIRECTORY}/service-jwks.json:/run/auth/service-jwks.json:ro
      - ${AUTH_KEYS_DIRECTORY}/patient-service.pem:/run/auth/service.pem:ro
      - ${AUTH_KEYS_DIRECTORY}/patient-signing.pem:/run/auth/patient-signing.pem:ro
      - ${AUTH_KEYS_DIRECTORY}/idempotency.key:/run/auth/idempotency.key:ro
  doctor:
