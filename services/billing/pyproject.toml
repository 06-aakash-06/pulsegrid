[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsegrid-billing-service"
version = "0.1.0"
description = "PulseGrid Billing service scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["billing_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
