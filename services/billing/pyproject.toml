[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsegrid-billing-service"
version = "0.1.0"
description = "PulseGrid Billing service scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "PyJWT[crypto]>=2.10,<3",
    "opentelemetry-api>=1.45,<2.0",
    "opentelemetry-sdk>=1.45,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2.0",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
    "opentelemetry-instrumentation-redis==0.66b1",
    "httpx>=0.27,<1",
    "aio-pika>=9.6.2,<10",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["billing_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
